{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h2>Log in</h2>
    <form method="post">
      <label>Username<input name="username" required autofocus></label>
      <label>Password<input type="password" name="password" required></label>
      <button type="submit">Log in</button>
    </form>
    <p class="muted">No account? <a href="{{ url_for('bank.register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
